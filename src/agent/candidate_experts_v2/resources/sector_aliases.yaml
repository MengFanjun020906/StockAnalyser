# 板块规范化别名表（人工维护，可 review）
#
# 用途：
#   1) 把个股所属行业板块名映射到稳定的 industry_key（供 FAC-03 等复用）；
#   2) 当 bk_code 精确匹配失败时，作为名称精确等于的兜底（禁止子串/包含/正则）。
#
# 规则：
#   - 只做「归一化后完全相等」匹配：NFKC + 去空白 + 全半角归一；
#   - 同一个 alias 命中多个 canonical → 视为歧义，不计算，记 unmapped；
#   - bk_code 仅作该 canonical 的代表板块；实际映射优先使用个股所属板块自身的 bk_code。
version: 1

