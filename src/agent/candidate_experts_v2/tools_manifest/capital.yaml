# -*- coding: utf-8 -*-
# Capital-flow dimension tool manifest.
#
# Business semantics layer for the 11 tools whitelisted in
# CapitalFlowExpert (see src/agent/candidate_experts_v2/experts/capital_flow.py).
# ToolDefinition keeps canonical name + JSON Schema; this file adds when_to_use /
# combo_hints / failure_modes so the LLM knows HOW to actually use each tool.
#
# Fields are validated by tools_manifest/_schema.py::ManifestEntry.
# Loader cross-checks (tools_manifest/__init__.py::validate_manifest):
#   - every `tool` must be in CapitalFlowExpert.tool_whitelist
#   - every `tool` must be registered in the global ToolRegistry
#   - every `typical_args` key must be a real ToolDefinition parameter name
#
# `typical_args` values support runtime placeholders rendered by
# render_typical_args(): {today}, {seed_codes}, etc.

dimension: capital
description: >-
  资金面候选发现专家可调用的工具集，覆盖个股资金流、龙虎榜、涨停/连板天梯、
  题材与游资热度。优先用 Tushare 直连接口取证，StockAPI 仅作热度/游资补充。

tools:
  # ---------------------------------------------------------------------------
  # 个股资金流（主力净流入 / 板块资金流）
  # ---------------------------------------------------------------------------
  - tool: get_tushare_moneyflow_ths
    priority: 10
    when_to_use: >-
      已有具体股票代码、需要看「主力/超大单/大单/中单/小单」近 N 个交易日资金
      流向时的首选。同花顺口径，比东财更稳定，建议作为 L1 资金面证据主链路。
    typical_args:
      stock_code: "{seed_codes}"
      limit: 10
    returns_summary: >-
      返回最近 limit 个交易日的同花顺个股资金流，按日期倒序。每行包含主力净流入、
      超大/大/中/小单净额与净占比，以及当日收盘价与涨跌幅。
    key_fields:
      - trade_date
      - close
      - pct_change
      - buy_lg_amount_rate
      - buy_elg_amount_rate
      - net_amount
      - net_d5_amount
    combo_hints:
      - 与 get_tushare_moneyflow_dc 交叉验证：两源同向（同为主力净流入）才记为高置信资金面候选。
      - 与 get_tushare_limit_list_d / limit_step 联动：连板 + 主力持续净流入 = 强势资金共振。
      - 若 net_d5_amount 连续为正但 close 滞涨，标记为「资金先行」候选。
    cost: cheap
    failure_modes:
      - 非交易日或停牌日返回空。
      - 港股 / 美股代码无返回，必须先确认是 A 股 6 位代码。

  - tool: get_tushare_moneyflow_dc
    priority: 11
    when_to_use: >-
      作为 get_tushare_moneyflow_ths 的交叉验证源；东财口径，对极短线主力行为
      更敏感。当 THS 与 DC 同向时资金面证据置信度提升。
    typical_args:
      stock_code: "{seed_codes}"
      limit: 10
    returns_summary: >-
      返回最近 limit 个交易日东方财富口径的个股资金流，字段与 THS 版本同构但
      数值可能略有差异（统计口径不同）。
    key_fields:
      - trade_date
      - close
      - pct_change
      - net_amount
      - net_d5_amount
      - buy_elg_amount
    combo_hints:
      - 与 THS 同时调用并做差：差值过大（>30%）提示口径背离，需在 expert opinion 中标注。
      - 单独使用时优先看 net_amount + net_d5_amount 是否同号。
    cost: cheap
    failure_modes:
      - 非交易日返回空。
      - 个别次新股 / ST 股可能东财侧覆盖滞后。

  - tool: get_capital_flow
    priority: 30
    when_to_use: >-
      Tushare 资金流不可用（鉴权失败 / 私有网关超时 / 空表）时的兜底；底层会
      先试 Tushare moneyflow，再回退 StockAPI codeFlow，并支持按日期窗口拉历史。
    typical_args:
      stock_code: "{seed_codes}"
      page_size: 50
    returns_summary: >-
      返回个股资金流的统一视图：source 字段标明真实数据源（tushare/stockapi），
      含最近主力净流入、5/10 日累计资金流与按日明细。
    key_fields:
      - source
      - latest_main_net_inflow
      - cum_main_net_inflow_5d
      - cum_main_net_inflow_10d
      - daily_flows
    combo_hints:
      - 仅在 THS/DC 两源都不可用时调用，避免重复取数。
      - source=stockapi 时数据时效可能滞后一个交易日，需在结论中注明。
    cost: medium
    failure_modes:
      - 私有网关超时（默认 15s 预算）。
      - StockAPI codeFlow 60047：当日数据未更新（15:30 前）。

  # ---------------------------------------------------------------------------
  # 龙虎榜 — 个股与机构买卖席位
  # ---------------------------------------------------------------------------
  - tool: get_tushare_dragon_tiger_list
    priority: 20
    when_to_use: >-
      个股当日异动或涨停时，确认是否上龙虎榜、买卖金额与净额；用于识别游资 vs
      机构主导，以及是否为「一日游」资金。
    typical_args:
      stock_code: "{seed_codes}"
      trade_date: "{today}"
      limit: 5
    returns_summary: >-
      返回个股最近 limit 次上榜记录，含上榜原因、买入/卖出/净额、上榜营业部
      数与异动类型。
    key_fields:
      - trade_date
      - reason
      - l_buy
      - l_sell
      - net_amount
      - turnover_rate
    combo_hints:
      - 与 get_tushare_dragon_tiger_inst 联动：机构买入额 > 游资买入额 → 机构主导。
      - 与 limit_list_d 联动：涨停 + 龙虎榜净买 → 高置信短线候选；涨停 + 龙虎榜净卖 → 出货嫌疑。
    cost: cheap
    failure_modes:
      - 当日未上榜返回空。
      - trade_date 非交易日返回空。

  - tool: get_tushare_dragon_tiger_inst
    priority: 21
    when_to_use: >-
      已确认股票上了龙虎榜，需要识别买卖席位中机构占比与著名游资席位时使用。
    typical_args:
      stock_code: "{seed_codes}"
      trade_date: "{today}"
      limit: 10
    returns_summary: >-
      返回某日某股的龙虎榜机构席位明细，含席位名称（机构专用/营业部名）、
      买入额、卖出额、净额。
    key_fields:
      - exalter
      - buy
      - sell
      - net_buy
      - side
    combo_hints:
      - 「机构专用」席位净买 > 0 → 机构资金参与信号。
      - 知名游资席位（如「拉萨」「东方财富拉萨」）出现 → 标记游资标签。
    cost: cheap
    failure_modes:
      - 必须先经 get_tushare_dragon_tiger_list 确认当日上榜，否则返回空。

  # ---------------------------------------------------------------------------
  # 涨停榜 / 连板天梯
  # ---------------------------------------------------------------------------
  - tool: get_tushare_limit_list_d
    priority: 15
    when_to_use: >-
      需要拿当日全市场涨停 / 跌停 / 炸板列表做候选发现（无 seed_codes 时尤其
      重要），或验证特定个股是否在涨停榜内。Tushare 官方口径，最稳。
    typical_args:
      trade_date: "{today}"
      limit: 50
    returns_summary: >-
      返回 trade_date 当日涨停 / 跌停 / 炸板个股清单，含封板时间、封单金额、
      连板数、所属板块、首次涨停时间。
    key_fields:
      - ts_code
      - name
      - limit
      - limit_times
      - fc_ratio
      - fl_ratio
      - first_time
      - last_time
    combo_hints:
      - 与 limit_step 联动确认连板天梯位置（首板 / 二板 / 高位板）。
      - 与 limit_list_ths 同向时强化候选；分歧时优先官方 limit_list_d。
      - fc_ratio（封板成交占比）低 + last_time 早 = 强势封板。
    cost: cheap
    failure_modes:
      - 非交易日返回空。
      - 限于 A 股，港股美股代码不适用。

  - tool: get_tushare_limit_list_ths
    priority: 16
    when_to_use: >-
      同花顺涨停榜，与官方版本交叉验证；THS 额外提供「连板原因 / 题材标签」，
      做主题分类时优先。
    typical_args:
      trade_date: "{today}"
      limit: 50
    returns_summary: >-
      THS 当日涨停清单，含连板数、封板时间、所属题材标签、上榜原因。
    key_fields:
      - ts_code
      - name
      - tag
      - status
      - lu_time
      - turnover_rate
    combo_hints:
      - 用 tag 字段聚合「同题材连板群」→ 形成主题候选包。
      - 与 limit_list_d 同时出现的个股置信度更高。
    cost: cheap
    failure_modes:
      - 非交易日空。
      - 个别新股 THS 标签可能滞后一日。

  - tool: get_tushare_limit_step
    priority: 14
    when_to_use: >-
      需要看连板天梯（几连板、断板原因）以筛选高位强势股或低位首板时使用，
      做连板高度排序的首选。
    typical_args:
      trade_date: "{today}"
      limit: 30
    returns_summary: >-
      连板天梯：按当前连板数倒序，含 ts_code、连板数、首次涨停日、当前涨停
      状态。
    key_fields:
      - ts_code
      - name
      - nums
      - open_times
      - up_stat
    combo_hints:
      - nums >= 3 → 高位股，需重点评估退潮风险（结合 dragon_tiger 卖出端）。
      - nums == 1 → 首板候选，结合 moneyflow_ths 主力净流入做接力候选。
    cost: cheap
    failure_modes:
      - 非交易日空。

  # ---------------------------------------------------------------------------
  # 热度 / 题材 / 游资
  # ---------------------------------------------------------------------------
  - tool: get_tushare_hot_rank
    priority: 40
    when_to_use: >-
      验证候选股是否处于市场关注度上升通道（同花顺/东财热榜），或在无 seed
      时获取当日热度榜单做候选发现。
    typical_args:
      source: "ths"
      trade_date: "{today}"
      limit: 50
    returns_summary: >-
      返回某数据源（THS/DC）当日热度榜，含热度排名、热度分、是否新进榜。
    key_fields:
      - ts_code
      - name
      - rank
      - hot
      - rank_chg
    combo_hints:
      - rank_chg 大幅上升 + 涨停榜 → 强热度共振候选。
      - 仅热度上升但无资金流佐证 → 标为「观察」而非「候选」。
    cost: cheap
    failure_modes:
      - source 参数错误时返回空（仅支持 ths / dc）。
      - 部分新股早盘热度数据缺失。

  - tool: get_stockapi_popularity_rank
    priority: 50
    when_to_use: >-
      Tushare 热榜不可用、或需要 StockAPI 独立的人气榜口径做交叉验证时使用。
      默认串行限流，避免并发触发 88888 退避。
    typical_args:
      limit: 50
    returns_summary: >-
      StockAPI 个股人气榜：含人气排名、关注人数、新晋上榜标记。
    key_fields:
      - code
      - name
      - rank
      - popularity
      - is_new
    combo_hints:
      - 与 get_tushare_hot_rank 同向 → 高置信度热度候选。
      - StockAPI 单点波动较大，需结合资金流二次确认。
    cost: medium
    failure_modes:
      - StockAPI 60050 权限/参数错误。
      - 88888 限流（已串行化但仍可能短时退避）。

  - tool: get_stockapi_hot_money_activity
    priority: 45
    when_to_use: >-
      需要识别游资活动（哪些营业部今日活跃、活跃游资盘了哪些个股），用于解读
      龙虎榜背后的资金性质。stock_code 模式查个股，缺省时返回当日活跃游资排行。
    typical_args:
      stock_code: "{seed_codes}"
      limit: 20
    returns_summary: >-
      返回游资活跃度数据：rank 模式按席位排序，stock 模式按个股净买排序。
      含席位名、关联个股、净买额、近 N 日胜率。
    key_fields:
      - source
      - hm_name
      - ts_code
      - net_amount
      - win_rate
    combo_hints:
      - 与 dragon_tiger_inst 联动：游资席位 + 当日上榜 → 短线游资资金确认。
      - source=akshare（降级）时数据为代理数据，需在结论中注明降级。
    cost: medium
    failure_modes:
      - StockAPI 60050 → 自动降级到 AKShare 龙虎榜代理数据。
      - 个别冷门股可能无游资覆盖。
